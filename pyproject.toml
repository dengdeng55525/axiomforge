[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomforge"
version = "0.1.0"
description = "Evidence-grounded algorithm capability factory with bounded agent workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.8,<3", "httpx>=0.27,<1", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "typer>=0.12,<1", "python-dotenv>=1,<2",
  "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<1.8",
  "psutil>=6,<8", "networkx>=3,<4",
  "langchain-core>=1.6.5,<2", "langsmith>=0.14,<1", "openai>=3.20,<4"
]

[project.urls]
Homepage = "https://github.com/dengdeng55525/axiomforge"
Repository = "https://github.com/dengdeng55525/axiomforge"
Issues = "https://github.com/dengdeng55525/axiomforge/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pytest-cov>=5,<8"]
ui = ["streamlit>=1.40,<2", "plotly>=5,<8"]

[project.scripts]
axiomforge = "capability_factory.cli:app"
algoforge = "capability_factory.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real API call; opt-in and billable", "integration: dataset-backed end-to-end tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
