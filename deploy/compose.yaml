services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ../data/raw:/app/data/raw:ro
      - artifacts:/app/artifacts
    cpus: 4
    mem_limit: 6g
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  ui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["streamlit", "run", "ui/app.py", "--server.address", "0.0.0.0", "--server.port", "8501", "--server.headless", "true"]
    environment:
      ALGOFORGE_API_URL: http://api:8000
    ports: ["127.0.0.1:8501:8501"]
    depends_on: [api]
    cpus: 1
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  artifacts:
# Deployment template, not tested here: Docker is absent on the current host.
# The app container is not an independent per-candidate OS sandbox.
